apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: floricultura-hpa
  namespace: floricultura
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: floricultura-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
