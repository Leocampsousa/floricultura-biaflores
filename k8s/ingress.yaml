apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: floricultura-ingress
  namespace: floricultura
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # --- 1. RATE LIMITING RIGOROSO NO INGRESS (Sem CDN na frente) ---
    # Limite de 10 requisições por segundo por IP do cliente
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # Permite rajada de até 20 requisições antes de bloquear
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # Limite de conexões simultâneas por IP
    nginx.ingress.kubernetes.io/limit-connections: "5"

    # --- 2. PROTEÇÃO DE BUFFER & TIMEOUTS CONTRA SLOW DDoS ---
    nginx.ingress.kubernetes.io/proxy-body-size: "50k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"

    # --- 3. WAF MODSECURITY NATIVO (OWASP Core Rule Set) ---
    # Habilita o WAF no Nginx Ingress para inspecionar requisições maliciosas
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess Off
      SecAuditLogParts ABIJDEFHZ
      SecAction "id:900200,phase:1,nolog,pass,t:none,setvar:tx.allowed_methods=GET HEAD"
spec:
  rules:
  - host: floricultura.seudominio.com.br # Substitua pelo seu domínio personalizado
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: floricultura-service
            port:
              number: 80
  # Descomente para habilitar HTTPS / TLS com certificado
  # tls:
  # - hosts:
  #   - floricultura.seudominio.com.br
  #   secretName: floricultura-tls-secret
