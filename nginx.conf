# Pega o IP real do cliente através do Azure Load Balancer / Ingress
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate limiting para proteção contra HTTP Flood / DDoS na camada 7
limit_req_zone $binary_remote_addr zone=one:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proteção contra ataques Slowloris (Timeouts agressivos)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # Limite rígido de tamanho de requisição (site estático não recebe uploads)
    client_max_body_size 50k;
    client_body_buffer_size 50k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;

    # Aplicação do Rate Limiting
    limit_req zone=one burst=25 nodelay;
    limit_conn addr 15;

    # Otimizações de compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Headers de Segurança Avançados
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Bloqueio de métodos HTTP não autorizados (somente GET e HEAD)
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Endpoint de Health Check para probes do Kubernetes (AKS)
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Cache longo para arquivos estáticos com hash ou assets
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache moderado para CSS e JS
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Página principal (HTML sempre fresco)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Roteamento padrão
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Páginas de erro amigáveis
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
