services:
  floricultura-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: floricultura-bia:latest
    container_name: floricultura_bia_app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
